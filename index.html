<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon SaaS IA</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; margin-top: 0; }
    input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; margin-bottom: 12px; }
    textarea { height: 100px; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; }
    button:hover { background: #7dd3fc; }
    #result { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mon Assistant IA</h1>
    
    <label for="apiKey">Clé API Gemini :</label>
    <input type="password" id="apiKey" placeholder="Colle ta clé API Gemini ici (ex: AIzaSy...)" />

    <label for="prompt">Ta demande :</label>
    <textarea id="prompt" placeholder="Ex: Donne-moi 3 idées de sujets..."></textarea>
    
    <button onclick="generateText()">Générer</button>
    <div id="result">Le résultat s'affichera ici...</div>
  </div>

  <script>
    async function generateText() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const userPrompt = document.getElementById("prompt").value;
      const resultDiv = document.getElementById("result");

      if (!apiKey) { alert("Merci de renseigner ta clé API !"); return; }
      if (!userPrompt) { alert("Écris une demande !"); return; }
      
      resultDiv.innerText = "Génération en cours...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: userPrompt }] }] })
        });
        const data = await response.json();
        
        if (data.error) {
          resultDiv.innerText = "Erreur API : " + data.error.message;
        } else {
          const text = data.candidates[0].content.parts[0].text;
          resultDiv.innerText = text;
        }
      } catch (error) {
        resultDiv.innerText = "Erreur lors de la connexion.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
