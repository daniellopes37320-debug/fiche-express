<html lang="fr">
<head>

    <title>CopySaaS – Générateur e-Commerce IA</title>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg: #0b0f19;
        --card-bg: #151c2c;
        --border: #232d42;
        --accent: #0284c7;
        --accent-hover: #38bdf8;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --danger: #ef4444;
      }

      body { 
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
        background-color: var(--bg); 
        color: var(--text); 
        display: flex; 
        justify-content: center; 
        padding: 40px 16px; 
        margin: 0;
        min-height: 100vh;
      }

      .card { 
        background: var(--card-bg); 
        padding: 36px; 
        border-radius: 16px; 
        width: 100%; 
        max-width: 800px; 
        border: 1px solid var(--border);
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5); 
      }

      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: rgba(2, 132, 199, 0.15);
        color: var(--accent-hover);
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      h1 { 
        color: #fff; 
        margin: 0 0 24px 0; 
        font-size: 26px; 
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      label { 
        display: block; 
        margin-bottom: 8px; 
        font-weight: 600; 
        font-size: 13px; 
        color: var(--text-muted); 
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .api-key-container {
        display: flex;
        gap: 8px;
        margin-bottom: 6px;
      }

      input[type="password"], input[type="text"], textarea, input[type="file"] { 
        width: 100%; 
        padding: 14px; 
        border-radius: 10px; 
        border: 1px solid var(--border); 
        background: #0f172a; 
        color: #fff; 
        box-sizing: border-box; 
        font-family: inherit;
        font-size: 14px;
        transition: all 0.2s ease;
      }

      .btn-sm {
        background: #0f172a;
        color: var(--text-muted);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 16px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        transition: all 0.2s ease;
      }

      .btn-sm:hover {
        background: #1e293b;
        color: #fff;
      }

      .help-text {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 0;
        margin-bottom: 20px;
        line-height: 1.5;
      }

      .help-text a {
        color: var(--accent-hover);
        text-decoration: underline;
      }

      input[type="file"] {
        cursor: pointer;
        margin-bottom: 20px;
      }

      textarea {
        margin-bottom: 20px;
        height: 100px;
        resize: vertical;
      }

      input:focus, textarea:focus {
        outline: none;
        border-color: var(--accent-hover);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      .btn-main { 
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
        color: #fff; 
        font-weight: 600; 
        border: none; 
        padding: 14px 20px; 
        border-radius: 10px; 
        cursor: pointer; 
        width: 100%; 
        font-size: 15px; 
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      }

      .btn-main:hover { 
        background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        transform: translateY(-1px);
      }

      .btn-main:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      .btn-secondary {
        flex: 1;
        background: #0f172a;
        color: var(--text-muted);
        border: 1px solid var(--border);
        padding: 12px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease;
        display: none;
      }

      .btn-secondary:hover {
        background: #1e293b;
        color: #fff;
        border-color: #475569;
      }

      #result { 
        margin-top: 24px; 
        padding: 24px; 
        background: #0f172a; 
        border-radius: 12px; 
        border: 1px solid var(--border); 
        line-height: 1.7;
        font-size: 15px;
        color: #cbd5e1;
        min-height: 80px;
      }

      .error-box {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 16px;
        border-radius: 10px;
        font-size: 14px;
      }

      #result h1, #result h2, #result h3 { color: #fff; margin-top: 24px; margin-bottom: 12px; font-weight: 700; }
      #result h3 { font-size: 18px; color: var(--accent-hover); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
      #result ul { padding-left: 20px; }
      #result li { margin-bottom: 8px; }
      #result strong { color: #fff; }
      #result hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    </style>
</head>
<body>
  <div class="card">
    <span class="badge">IA E-commerce & SEO</span>
    <h1>Générateur de Fiches Produits</h1>
    
    <label for="apiKey">Clé API Gemini</label>
    <div class="api-key-container">
      <input type="password" id="apiKey" placeholder="Colle ta clé API Gemini..." />
      <button class="btn-sm" id="clearKeyBtn" onclick="clearApiKey()" title="Effacer la clé enregistrée">Effacer</button>
    </div>
    <p class="help-text">
      🔑 <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Obtenir une clé gratuite Gemini sur Google AI Studio</a><br>
      🔒 <em>Votre clé est stockée uniquement sur votre navigateur (localStorage). Aucun serveur tiers n'y a accès.</em>
    </p>

    <label for="prompt">Description du produit (optionnelle si image)</label>
    <textarea id="prompt" placeholder="Ex: Gourde isotherme en inox 750ml, noir mat, garde au froid 24h..."></textarea>

    <label for="imageInput">Photo du produit (optionnel)</label>
    <input type="file" id="imageInput" accept="image/*" />
    
    <button class="btn-main" id="generateBtn" onclick="generateText()">Générer la Fiche Produit</button>

    <div class="actions">
      <button id="copyBtn" class="btn-secondary" onclick="copyResult()">📋 Copier le texte</button>
      <button id="downloadBtn" class="btn-secondary" onclick="downloadResult()">📥 Télécharger (.txt)</button>
    </div>

    <div id="result">La fiche produit générée s'affichera ici...</div>
  </div>

  <script>
    let rawGeneratedText = "";

    // Charger la clé sauvegardée au démarrage
    window.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) {
        document.getElementById("apiKey").value = savedKey;
      }
    });

    function clearApiKey() {
      localStorage.removeItem("gemini_api_key");
      document.getElementById("apiKey").value = "";
      alert("Clé API effacée du stockage local.");
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function generateText() {
      const apiKeyInput = document.getElementById("apiKey");
      const apiKey = apiKeyInput.value.trim();
      const productInput = document.getElementById("prompt").value.trim();
      const imageInput = document.getElementById("imageInput");
      const resultDiv = document.getElementById("result");
      const copyBtn = document.getElementById("copyBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const generateBtn = document.getElementById("generateBtn");

      if (!apiKey) { 
        alert("Veuillez saisir votre clé API Gemini !"); 
        apiKeyInput.focus();
        return; 
      }

      if (!productInput && !imageInput.files[0]) { 
        alert("Saisissez une description ou ajoutez une photo de votre produit !"); 
        return; 
      }

      // Sauvegarder la clé localement
      localStorage.setItem("gemini_api_key", apiKey);

      // UI en état de chargement
      resultDiv.innerHTML = "⏳ <em>Génération de votre fiche produit en cours par l'IA...</em>";
      copyBtn.style.display = "none";
      downloadBtn.style.display = "none";
      generateBtn.disabled = true;

      const systemPrompt = `Tu es un copywriter e-commerce professionnel chevronné. Ton objectif est de rédiger une fiche produit percutante, crédible et naturelle, comme le ferait une marque D2C haut de gamme.

RÈGLES D'ÉCRITURE STRICTES (TON HUMAIN, SÉRIEUX & CONCRET) :
1. ÉVITE ABSOLUMENT les clichés et buzzwords d'IA : "Révolutionnez", "Plongez dans", "Inégalé", "Sublimez", "Que vous soyez...", "Ne cherchez plus", "L'expérience ultime", "Incontournable".
2. Écris de manière directe, moderne et réaliste. Pas d'enthousiasme artificiel ou de superlatifs exagérés.
3. Concentre-toi sur des bénéfices concrets, des usages réels et la résolution de problèmes réels pour le client.
4. Le ton doit être fluide, élégant et convaincant sans faire "vendeur de tapis".

Restitue le tout selon cette structure exacte :

### 1. SEO & Métadonnées
- Balise Title (max 60 caractères) : 
- Meta Description (max 155 caractères) : 
- URL Slug suggéré : 

### 2. Fiche Produit E-commerce (Site Web)
- Titre H1 du produit : 
- Accroche (2-3 lignes percutantes et crédibles) : 
- Les 3 bénéfices clés (Focus usage & problème résolu) :
- Description détaillée (2 paragraphes fluides, ton de marque professionnel) : 
- Caractéristiques techniques (Liste claire) : 

### 3. Réseaux Sociaux & Publicités
- Post Instagram / TikTok (Légende naturelle, ton pro, émojis modérés) : 
- Accroche publicitaire (Format Meta Ads direct et vendeur) : 

Voici les informations textuelles fournies par l'utilisateur : ${productInput || "Aucune description fournie, analyse l'image."}`;

      const parts = [{ text: systemPrompt }];

      if (imageInput.files[0]) {
        try {
          const file = imageInput.files[0];
          const base64Data = await fileToBase64(file);
          parts.push({
            inline_data: {
              mime_type: file.type,
              data: base64Data
            }
          });
        } catch (err) {
          resultDiv.innerHTML = `<div class="error-box"><strong>Erreur :</strong> Impossible de lire l'image sélectionnée.</div>`;
          generateBtn.disabled = false;
          return;
        }
      }

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: parts }] })
        });
        
        const data = await response.json();

        if (!response.ok || data.error) {
          const status = response.status;
          const errorMsg = data.error?.message || "Erreur inconnue";

          if (status === 429 || errorMsg.includes("quota") || errorMsg.includes("exceeded")) {
            resultDiv.innerHTML = `
              <div class="error-box">
                <strong>⏳ Limite de requêtes atteinte :</strong><br>
                L'offre gratuite de l'API Gemini autorise un maximum de 5 requêtes par minute.<br>
                Veuillez patienter <strong>1 minute</strong> avant de relancer une génération.
              </div>`;
          } else if (status === 400 || errorMsg.includes("API key")) {
            resultDiv.innerHTML = `
              <div class="error-box">
                <strong>🔑 Clé API invalide :</strong><br>
                Vérifiez que votre clé API Gemini est correcte et active sur Google AI Studio.
              </div>`;
          } else {
            resultDiv.innerHTML = `
              <div class="error-box">
                <strong>Erreur API (${status}) :</strong> ${errorMsg}
              </div>`;
          }
        } else {
          rawGeneratedText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Aucun texte n'a été généré.";
          resultDiv.innerHTML = marked.parse(rawGeneratedText);
          copyBtn.style.display = "block";
          downloadBtn.style.display = "block";
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="error-box">
            <strong>Erreur réseau :</strong> Impossible de contacter l'API Google Gemini. Vérifiez votre connexion internet.
          </div>`;
        console.error(error);
      } finally {
        generateBtn.disabled = false;
      }
    }

    function copyResult() {
      if (!rawGeneratedText) return;
      navigator.clipboard.writeText(rawGeneratedText).then(() => {
        const copyBtn = document.getElementById("copyBtn");
        copyBtn.innerText = "✅ Copié !";
        setTimeout(() => { copyBtn.innerText = "📋 Copier le texte"; }, 2000);
      });
    }

    function downloadResult() {
      if (!rawGeneratedText) return;
      const blob = new Blob([rawGeneratedText], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "fiche-produit.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
