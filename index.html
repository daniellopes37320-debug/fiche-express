<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Fiche Produit IA</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 700px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; margin-top: 0; }
    input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; margin-bottom: 12px; }
    textarea { height: 120px; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background: #7dd3fc; }
    #result { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Générateur de Fiche Produit E-commerce</h1>
    
    <label for="apiKey">Clé API Gemini :</label>
    <input type="password" id="apiKey" placeholder="Colle ta clé API Gemini ici (ex: AIzaSy...)" />

    <label for="prompt">Description ou lien de ton produit :</label>
    <textarea id="prompt" placeholder="Ex: Une gourde isotherme en inox de 750ml qui garde le froid pendant 24h, couleur noir mat..."></textarea>
    
    <button onclick="generateText()">Générer la Fiche Produit</button>
    <div id="result">La fiche produit générée s'affichera ici...</div>
  </div>

  <script>
    async function generateText() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const productInput = document.getElementById("prompt").value;
      const resultDiv = document.getElementById("result");

      if (!apiKey) { alert("Merci de renseigner ta clé API !"); return; }
      if (!productInput) { alert("Saisis une description de produit !"); return; }
      
      resultDiv.innerText = "Génération de la fiche produit par l'IA en cours...";

      const systemPrompt = `Tu es un expert mondial en copywriting e-commerce et en SEO. À partir du produit, du lien ou de la simple description fourni par l'utilisateur, génère directement une fiche produit complète et prête à être publiée.

Analyse le produit pour deviner par toi-même la cible idéale, le ton le plus adapté et les arguments de vente percutants, puis restitue le tout selon cette structure exacte :

### 1. SEO & Métadonnées
- Balise Title (max 60 caractères) : 
- Meta Description (max 155 caractères) : 
- URL Slug suggéré : 

### 2. Fiche Produit E-commerce (Site Web)
- Titre H1 du produit : 
- Accroche (2-3 lignes) : 
- Les 3 bénéfices clés (Bullet points) :
- Description détaillée (2 à 3 paragraphes avec du storytelling et intégration fluide des mots-clés) : 
- Caractéristiques techniques (Liste) : 

### 3. Réseaux Sociaux & Publicités
- Post Instagram / TikTok (Légende + émojis + hashtags) : 
- Accroche publicitaire (Format Meta Ads) : 

Voici le produit : ${productInput}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
        });
        const data = await response.json();
        
        if (data.error) {
          resultDiv.innerText = "Erreur API : " + data.error.message;
        } else {
          const text = data.candidates[0].content.parts[0].text;
          resultDiv.innerText = text;
        }
      } catch (error) {
        resultDiv.innerText = "Erreur lors de la connexion à l'API.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
