<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Fiche Produit IA</title>
  <!-- Inclusion de Marked.js pour le rendu Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      padding: 40px 20px; 
      margin: 0;
    }
    .card { 
      background: #1e293b; 
      padding: 30px; 
      border-radius: 12px; 
      width: 100%; 
      max-width: 750px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
    }
    h1 { color: #38bdf8; margin-top: 0; font-size: 24px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #94a3b8; }
    input, textarea { 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      border: 1px solid #334155; 
      background: #0f172a; 
      color: #fff; 
      box-sizing: border-box; 
      margin-bottom: 16px; 
      font-size: 14px;
    }
    textarea { height: 120px; resize: vertical; }
    .btn-main { 
      background: #38bdf8; 
      color: #0f172a; 
      font-weight: bold; 
      border: none; 
      padding: 14px 20px; 
      border-radius: 8px; 
      cursor: pointer; 
      width: 100%; 
      font-size: 16px; 
      transition: background 0.2s;
    }
    .btn-main:hover { background: #7dd3fc; }
    
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-secondary {
      flex: 1;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
      display: none; /* Masqué jusqu'à ce qu'une fiche soit générée */
    }
    .btn-secondary:hover {
      background: #475569;
      color: #38bdf8;
    }

    #result { 
      margin-top: 20px; 
      padding: 20px; 
      background: #0f172a; 
      border-radius: 8px; 
      border-left: 4px solid #38bdf8; 
      line-height: 1.6;
      font-size: 15px;
    }

    /* Style du contenu HTML généré */
    #result h1, #result h2, #result h3 { color: #38bdf8; margin-top: 20px; margin-bottom: 10px; }
    #result h3 { font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
    #result ul { padding-left: 20px; }
    #result li { margin-bottom: 6px; }
    #result p { margin-bottom: 12px; }
    #result strong { color: #f1f5f9; }
    #result hr { border: none; border-top: 1px solid #334155; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Générateur de Fiche Produit E-commerce</h1>
    
    <label for="apiKey">Clé API Gemini :</label>
    <input type="password" id="apiKey" placeholder="Colle ta clé API Gemini ici (ex: AIzaSy...)" />

    <label for="prompt">Description ou lien de ton produit :</label>
    <textarea id="prompt" placeholder="Ex: Une gourde isotherme en inox de 750ml qui garde le froid pendant 24h, couleur noir mat..."></textarea>
    
    <button class="btn-main" onclick="generateText()">Générer la Fiche Produit</button>

    <!-- Boutons d'action : Copier & Télécharger -->
    <div class="actions">
      <button id="copyBtn" class="btn-secondary" onclick="copyResult()">📋 Copier la fiche</button>
      <button id="downloadBtn" class="btn-secondary" onclick="downloadResult()">📥 Télécharger (.txt)</button>
    </div>

    <div id="result">La fiche produit générée s'affichera ici...</div>
  </div>

  <script>
    let rawGeneratedText = ""; // Stocke le texte brut pour la copie et le téléchargement

    async function generateText() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const productInput = document.getElementById("prompt").value;
      const resultDiv = document.getElementById("result");
      const copyBtn = document.getElementById("copyBtn");
      const downloadBtn = document.getElementById("downloadBtn");

      if (!apiKey) { alert("Merci de renseigner ta clé API !"); return; }
      if (!productInput) { alert("Saisis une description de produit !"); return; }
      
      resultDiv.innerHTML = "<em>Génération de la fiche produit par l'IA en cours...</em>";
      copyBtn.style.display = "none";
      downloadBtn.style.display = "none";

      const systemPrompt = `Tu es un expert mondial en copywriting e-commerce et en SEO. À partir du produit, du lien ou de la simple description fourni par l'utilisateur, génère directement une fiche produit complète et prête à être publiée.

Analyse le produit pour deviner par toi-même la cible idéale, le ton le plus adapté et les arguments de vente percutants, puis restitue le tout selon cette structure exacte :

### 1. SEO & Métadonnées
- Balise Title (max 60 caractères) : 
- Meta Description (max 155 caractères) : 
- URL Slug suggéré : 

### 2. Fiche Produit E-commerce (Site Web)
- Titre H1 du produit : 
- Accroche (2-3 lignes) : 
- Les 3 bénéfices clés (Bullet points) :
- Description détaillée (2 à 3 paragraphes avec du storytelling et intégration fluide des mots-clés) : 
- Caractéristiques techniques (Liste) : 

### 3. Réseaux Sociaux & Publicités
- Post Instagram / TikTok (Légende + émojis + hashtags) : 
- Accroche publicitaire (Format Meta Ads) : 

Voici le produit : ${productInput}`;

      let maxRetries = 3;
      let attempt = 0;
      let success = false;

      while (attempt < maxRetries && !success) {
        try {
          attempt++;
          if (attempt > 1) {
            resultDiv.innerHTML = `<em>Serveur occupé, nouvelle tentative (${attempt}/${maxRetries})...</em>`;
            await new Promise(resolve => setTimeout(resolve, 2000));
          }

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
          });
          
          const data = await response.json();
          
          if (data.error) {
            if (data.error.message.includes("high demand") && attempt < maxRetries) {
              continue;
            }
            resultDiv.innerText = "Erreur API : " + data.error.message;
            success = true;
          } else {
            rawGeneratedText = data.candidates[0].content.parts[0].text;
            
            // 1. Rendu Markdown propre via Marked.js
            resultDiv.innerHTML = marked.parse(rawGeneratedText);
            
            // Affichage des boutons d'actions
            copyBtn.style.display = "block";
            downloadBtn.style.display = "block";
            
            success = true;
          }
        } catch (error) {
          if (attempt >= maxRetries) {
            resultDiv.innerText = "Erreur lors de la connexion à l'API.";
            console.error(error);
          }
        }
      }
    }

    // 2. Fonction de copie dans le presse-papier
    function copyResult() {
      if (!rawGeneratedText) return;
      navigator.clipboard.writeText(rawGeneratedText).then(() => {
        const copyBtn = document.getElementById("copyBtn");
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "✅ Copié !";
        setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
      }).catch(err => {
        alert("Erreur lors de la copie.");
      });
    }

    // 3. Fonction de téléchargement du fichier texte (.txt)
    function downloadResult() {
      if (!rawGeneratedText) return;
      const blob = new Blob([rawGeneratedText], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "fiche-produit.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
