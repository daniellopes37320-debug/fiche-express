<!DOCTYPE html>
<html lang="fr">
<head>

    <title>CopySaaS – Générateur e-Commerce IA</title>

    <!-- Vercel Speed Insights & Analytics -->

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0b0f19;
        --card-bg: #151c2c;
        --border: #232d42;
        --accent: #0284c7;
        --accent-hover: #38bdf8;
        --text: #f8fafc;
        --text-muted: #94a3b8;
      }

      body { 
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
        background-color: var(--bg); 
        color: var(--text); 
        display: flex; 
        justify-content: center; 
        padding: 40px 16px; 
        margin: 0;
        min-height: 100vh;
      }

      .card { 
        background: var(--card-bg); 
        padding: 36px; 
        border-radius: 16px; 
        width: 100%; 
        max-width: 800px; 
        border: 1px solid var(--border);
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5); 
      }

      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: rgba(2, 132, 199, 0.15);
        color: var(--accent-hover);
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      h1 { 
        color: #fff; 
        margin: 0 0 24px 0; 
        font-size: 26px; 
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      label { 
        display: block; 
        margin-bottom: 8px; 
        font-weight: 600; 
        font-size: 13px; 
        color: var(--text-muted); 
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input[type="password"], textarea, input[type="file"] { 
        width: 100%; 
        padding: 14px; 
        border-radius: 10px; 
        border: 1px solid var(--border); 
        background: #0f172a; 
        color: #fff; 
        box-sizing: border-box; 
        margin-bottom: 20px; 
        font-family: inherit;
        font-size: 14px;
        transition: all 0.2s ease;
      }

      input[type="file"] {
        cursor: pointer;
      }

      input:focus, textarea:focus {
        outline: none;
        border-color: var(--accent-hover);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      textarea { height: 90px; resize: vertical; }

      .btn-main { 
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
        color: #fff; 
        font-weight: 600; 
        border: none; 
        padding: 14px 20px; 
        border-radius: 10px; 
        cursor: pointer; 
        width: 100%; 
        font-size: 15px; 
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      }

      .btn-main:hover { 
        background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        transform: translateY(-1px);
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      .btn-secondary {
        flex: 1;
        background: #0f172a;
        color: var(--text-muted);
        border: 1px solid var(--border);
        padding: 12px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease;
        display: none;
      }

      .btn-secondary:hover {
        background: #1e293b;
        color: #fff;
        border-color: #475569;
      }

      #result { 
        margin-top: 24px; 
        padding: 24px; 
        background: #0f172a; 
        border-radius: 12px; 
        border: 1px solid var(--border); 
        line-height: 1.7;
        font-size: 15px;
        color: #cbd5e1;
      }

      #result h1, #result h2, #result h3 { color: #fff; margin-top: 24px; margin-bottom: 12px; font-weight: 700; }
      #result h3 { font-size: 18px; color: var(--accent-hover); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
      #result ul { padding-left: 20px; }
      #result li { margin-bottom: 8px; }
      #result strong { color: #fff; }
      #result hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    </style>
</head>
<body>
  <div class="card">
    <span class="badge">IA E-commerce & SEO</span>
    <h1>Générateur de Fiches Produits</h1>
    
    <label for="apiKey">Clé API Gemini</label>
    <input type="password" id="apiKey" placeholder="Colle ta clé API Gemini..." />

    <label for="prompt">Description du produit (optionnelle si image)</label>
    <textarea id="prompt" placeholder="Ex: Gourde isotherme en inox 750ml, noir mat..."></textarea>

    <label for="imageInput">Photo du produit (optionnel)</label>
    <input type="file" id="imageInput" accept="image/*" />
    
    <button class="btn-main" onclick="generateText()">Générer la Fiche Produit</button>

    <div class="actions">
      <button id="copyBtn" class="btn-secondary" onclick="copyResult()">📋 Copier le texte</button>
      <button id="downloadBtn" class="btn-secondary" onclick="downloadResult()">📥 Télécharger (.txt)</button>
    </div>

    <div id="result">La fiche produit générée s'affichera ici...</div>
  </div>

  <script>
    let rawGeneratedText = "";

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function generateText() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const productInput = document.getElementById("prompt").value;
      const imageInput = document.getElementById("imageInput");
      const resultDiv = document.getElementById("result");
      const copyBtn = document.getElementById("copyBtn");
      const downloadBtn = document.getElementById("downloadBtn");

      if (!apiKey) { alert("Ajoute ta clé API !"); return; }
      if (!productInput && !imageInput.files[0]) { 
        alert("Saisis une description ou ajoute une image du produit !"); 
        return; 
      }
      
      resultDiv.innerHTML = "<em>Génération en cours par l'IA...</em>";
      copyBtn.style.display = "none";
      downloadBtn.style.display = "none";

      const systemPrompt = `Tu es un expert mondial en copywriting e-commerce et en SEO. Analyse le produit (à partir du texte et/ou de l'image fournie) pour deviner la cible idéale, le ton le plus adapté et les arguments de vente percutants.

Restitue le tout selon cette structure exacte :

### 1. SEO & Métadonnées
- Balise Title (max 60 caractères) : 
- Meta Description (max 155 caractères) : 
- URL Slug suggéré : 

### 2. Fiche Produit E-commerce (Site Web)
- Titre H1 du produit : 
- Accroche (2-3 lignes) : 
- Les 3 bénéfices clés (Bullet points) :
- Description détaillée (2 à 3 paragraphes avec du storytelling et intégration fluide des mots-clés) : 
- Caractéristiques techniques (Liste) : 

### 3. Réseaux Sociaux & Publicités
- Post Instagram / TikTok (Légende + émojis + hashtags) : 
- Accroche publicitaire (Format Meta Ads) : 

Voici les informations textuelles fournies par l'utilisateur : ${productInput || "Aucune description fournie, analyse l'image."}`;

      const parts = [{ text: systemPrompt }];

      if (imageInput.files[0]) {
        try {
          const file = imageInput.files[0];
          const base64Data = await fileToBase64(file);
          parts.push({
            inline_data: {
              mime_type: file.type,
              data: base64Data
            }
          });
        } catch (err) {
          resultDiv.innerText = "Erreur lors de la lecture de l'image.";
          return;
        }
      }

      let maxRetries = 3;
      let attempt = 0;
      let success = false;

      while (attempt < maxRetries && !success) {
        try {
          attempt++;
          if (attempt > 1) {
            resultDiv.innerHTML = `<em>Serveur occupé, nouvelle tentative (${attempt}/${maxRetries})...</em>`;
            await new Promise(resolve => setTimeout(resolve, 2000));
          }

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: parts }] })
          });
          
          const data = await response.json();
          
          if (data.error) {
            if (data.error.message.includes("high demand") && attempt < maxRetries) {
              continue;
            }
            resultDiv.innerText = "Erreur API : " + data.error.message;
            success = true;
          } else {
            rawGeneratedText = data.candidates[0].content.parts[0].text;
            resultDiv.innerHTML = marked.parse(rawGeneratedText);
            copyBtn.style.display = "block";
            downloadBtn.style.display = "block";
            success = true;
          }
        } catch (error) {
          if (attempt >= maxRetries) {
            resultDiv.innerText = "Erreur lors de la connexion à l'API.";
            console.error(error);
          }
        }
      }
    }

    function copyResult() {
      if (!rawGeneratedText) return;
      navigator.clipboard.writeText(rawGeneratedText).then(() => {
        const copyBtn = document.getElementById("copyBtn");
        copyBtn.innerText = "✅ Copié !";
        setTimeout(() => { copyBtn.innerText = "📋 Copier le texte"; }, 2000);
      });
    }

    function downloadResult() {
      if (!rawGeneratedText) return;
      const blob = new Blob([rawGeneratedText], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "fiche-produit.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
